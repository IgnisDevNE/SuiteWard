name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  inspect:
    name: Inspect repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.inspect.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: inspect
        run: ./scripts/ci.ps1 -Mode Inspect

  foundation:
    name: Foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads the whole history.
          fetch-depth: 0
          persist-credentials: false
      - name: Validate scripts, workflows, documentation, pins, and secrets
        run: ./scripts/check-foundation.ps1

  go:
    name: Go (${{ matrix.os }})
    needs: inspect
    if: needs.inspect.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      GOTOOLCHAIN: local
      GOPATH: ${{ github.workspace }}/.cache/gopath
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOBIN: ${{ github.workspace }}/.tools/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build, format, analyze, and test
        run: ./scripts/check-go.ps1
      - name: Verify fresh generated PostgreSQL queries
        run: ./scripts/check-persistence.ps1 -Mode Generated
      - name: Cross-build the installer for the release targets
        # The release workflow ships these four; building them on every change keeps the Windows and macOS code compiling. Go cross-compiles, so one runner is enough.
        if: runner.os == 'Linux'
        run: |
          foreach ($target in 'linux/amd64', 'linux/arm64', 'windows/amd64', 'darwin/arm64') {
            $goos, $goarch = $target -split '/'
            $env:CGO_ENABLED = '0'; $env:GOOS = $goos; $env:GOARCH = $goarch
            go build -trimpath -o (Join-Path $env:RUNNER_TEMP "suiteward-$goos-$goarch") ./cmd/suiteward
            if ($LASTEXITCODE -ne 0) { throw "go build failed for $target" }
          }

  coverage:
    name: Race, security, and coverage
    needs: inspect
    if: needs.inspect.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: docker.io/library/postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: suiteward_ci
          POSTGRES_PASSWORD: suiteward_ci_ephemeral
          POSTGRES_DB: suiteward_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U suiteward_ci -d suiteward_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOTOOLCHAIN: local
      GOPATH: ${{ github.workspace }}/.cache/gopath
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOBIN: ${{ github.workspace }}/.tools/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Race tests and real coverage report
        env:
          SUITEWARD_TEST_DATABASE_URL: postgresql://suiteward_ci:suiteward_ci_ephemeral@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/suiteward_ci?sslmode=disable
        run: ./scripts/check-go.ps1 -Coverage -Integration
      - name: Check reachable known vulnerabilities
        run: |
          # An installed Go module has no archive to hash, so dev/tools.json holds its version and the checksum database verifies the module.
          $version = (Get-Content dev/tools.json -Raw | ConvertFrom-Json).govulncheck.version
          go install "golang.org/x/vuln/cmd/govulncheck@v$version"
          if ($LASTEXITCODE -ne 0) { throw 'govulncheck installation failed' }
          & (Join-Path $env:GOBIN 'govulncheck') ./...
          if ($LASTEXITCODE -ne 0) { throw 'Vulnerability check failed or found reachable vulnerabilities' }
      - name: Preserve coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          use_oidc: true
          version: v11.3.1
          files: coverage.out
          disable_search: true
          fail_ci_if_error: true
          handle_no_reports_found: false
          cleanup: true

  image:
    name: Image build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Same pinned BuildKit image as release.yml (scripts/check-pins.ps1 keeps the copies in step).
      BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the builder
        run: docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
      - name: Build linux/amd64 and linux/arm64 without pushing
        # No other build of the image runs before a release tag: a broken Containerfile or a failing arm64 build shows on the pull request.
        # The result stays in the build cache: nothing is loaded, pushed, signed or attested.
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            --build-arg "GO_VERSION=$(cat .go-version)" \
            --file deploy/Containerfile --output type=cacheonly .

  gate:
    name: CI / Gate
    needs: [inspect, foundation, image, go, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable verification
        run: ./scripts/ci.ps1 -Mode Gate
