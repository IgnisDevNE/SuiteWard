# Publishes a release image to GHCR when a `vX.Y.Z` or `vX.Y.Z-rc.N` tag is pushed (D-RELEASE).
# Not part of the CI gate and not a required check.
# The tag alone does not publish: the `publish` job waits for the owner's approval in the protected `release` environment.
# A final `vX.Y.Z` must sit on a commit of `main`; a pre-release may sit anywhere and never moves `latest-stable`.
# Same build as deploy.yml, with the tag as the version and the tag's source tree as the corresponding source (AGPL section 13).
# No third-party actions: the runner's own docker and buildx do the work, and the BuildKit image below is pinned by digest.
# The pushed index carries a SLSA provenance and an SBOM (BuildKit attestation manifests) and is signed keyless with cosign through GitHub OIDC; the signature is recorded in the public Rekor log (ADR 0008).
# Consumers verify the signature with scripts/verify-release.ps1; the signing identity is this workflow at a `v*` tag.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ignisdevne/suiteward
  # moby/buildkit:buildx-stable-1 as of 2026-10-09.
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  # docker/buildkit-syft-scanner:stable-1 as of 2026-10-20: the SBOM generator BuildKit runs, pinned so its tag cannot move.
  SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history and branches, so origin/main is there for the ancestor check.
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: Check the tag and, for a final release, that it is on main
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::The tag $TAG is neither vX.Y.Z nor vX.Y.Z-rc.N"
            exit 1
          fi
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::The final release $TAG is not on a commit of main"; exit 1; }
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and push the release (owner approval)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      # Only this job: cosign exchanges the run's OIDC token for a short-lived signing certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the builder
        run: docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
        env:
          TAG: ${{ github.ref_name }}
        # Nothing is pushed yet. Only linux/amd64 is built and scanned: the arm64 image has the same packages and the same Go source.
        run: |
          docker buildx build --platform linux/amd64 --provenance=false \
            --build-arg "GO_VERSION=$(cat .go-version)" \
            --build-arg "VERSION=$TAG" \
            --build-arg "SOURCE=https://github.com/IgnisDevNE/SuiteWard/tree/$TAG" \
            --file deploy/Containerfile --output "type=docker,dest=$RUNNER_TEMP/candidate.tar" .
          pwsh ./scripts/check-image.ps1 -Archive "$RUNNER_TEMP/candidate.tar"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Install cosign
        # The binary pinned in dev/tools.json: a release asset checked against its SHA-256 before it is made executable.
        run: |
          read -r url sha256 < <(jq -er '.cosign.assets["linux-amd64"] | "\(.url) \(.sha256)"' dev/tools.json)
          curl --fail --silent --show-error --location --proto '=https' --output "$RUNNER_TEMP/cosign" "$url"
          echo "$sha256  $RUNNER_TEMP/cosign" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/cosign"
      - id: push
        name: Build and push linux/amd64 and linux/arm64
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tags=(--tag "$IMAGE:$TAG")
          if [ "$PRERELEASE" = false ]; then tags+=(--tag "$IMAGE:latest-stable"); fi
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --provenance=mode=max --attest "type=sbom,generator=$SBOM_GENERATOR" \
            --build-arg "GO_VERSION=$(cat .go-version)" \
            --build-arg "VERSION=$TAG" \
            --build-arg "SOURCE=https://github.com/IgnisDevNE/SuiteWard/tree/$TAG" \
            --label org.opencontainers.image.source=https://github.com/IgnisDevNE/SuiteWard \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --annotation index:org.opencontainers.image.source=https://github.com/IgnisDevNE/SuiteWard \
            --file deploy/Containerfile "${tags[@]}" \
            --metadata-file "$RUNNER_TEMP/meta.json" .
          # The index digest: the attestation manifests hang off it, so signing it covers them.
          echo "digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/meta.json")" >> "$GITHUB_OUTPUT"
      - name: Sign the image index and verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Unexpected image digest"; exit 1; }
          "$RUNNER_TEMP/cosign" sign --yes "$IMAGE@$DIGEST"
          pwsh ./scripts/verify-release.ps1 -Reference "$IMAGE@$DIGEST" -Cosign "$RUNNER_TEMP/cosign"
