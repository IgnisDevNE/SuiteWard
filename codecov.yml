codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 1
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 90%
        threshold: 0%
        if_not_found: failure
        informational: false

ignore:
  - "internal/adapters/postgres/internal/dbgen/**"
  - "internal/application/governance/governancetest/**"

comment:
  require_head: true
  require_changes: true
  hide_project_coverage: false

github_checks:
  annotations: false
