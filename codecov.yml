codecov:
  require_ci_to_pass: false
  notify:
    after_n_builds: 1
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: 90%
        threshold: 0%
        if_not_found: failure
        informational: false

ignore:
  - "internal/adapters/postgres/internal/dbgen/**"

comment:
  require_head: true
  require_changes: true
  hide_project_coverage: false

github_checks:
  annotations: false
