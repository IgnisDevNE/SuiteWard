name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  inspect:
    name: Inspect repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.inspect.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: inspect
        run: ./scripts/ci.ps1 -Mode Inspect

  foundation:
    name: Foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate scripts, workflows, and documentation
        run: ./scripts/check-foundation.ps1

  go:
    name: Go (${{ matrix.os }})
    needs: inspect
    if: needs.inspect.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      GOTOOLCHAIN: local
      GOPATH: ${{ github.workspace }}/.cache/gopath
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOBIN: ${{ github.workspace }}/.tools/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build, format, analyze, and test
        run: ./scripts/check-go.ps1
      - name: Verify fresh generated PostgreSQL queries
        run: ./scripts/check-persistence.ps1 -Mode Generated

  coverage:
    name: Race, security, and coverage
    needs: inspect
    if: needs.inspect.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: docker.io/library/postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: suiteward_ci
          POSTGRES_PASSWORD: suiteward_ci_ephemeral
          POSTGRES_DB: suiteward_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U suiteward_ci -d suiteward_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOTOOLCHAIN: local
      GOPATH: ${{ github.workspace }}/.cache/gopath
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOBIN: ${{ github.workspace }}/.tools/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Race tests and real coverage report
        env:
          SUITEWARD_TEST_DATABASE_URL: postgresql://suiteward_ci:suiteward_ci_ephemeral@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/suiteward_ci?sslmode=disable
        run: ./scripts/check-go.ps1 -Coverage -Integration
      - name: Verify fresh generated PostgreSQL queries
        run: ./scripts/check-persistence.ps1 -Mode Generated
      - name: Check reachable known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          if ($LASTEXITCODE -ne 0) { throw 'govulncheck installation failed' }
          & (Join-Path $env:GOBIN 'govulncheck') ./...
          if ($LASTEXITCODE -ne 0) { throw 'Vulnerability check failed or found reachable vulnerabilities' }
      - name: Preserve coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          use_oidc: true
          version: v11.3.1
          files: coverage.out
          disable_search: true
          fail_ci_if_error: true
          handle_no_reports_found: false
          cleanup: true

  gate:
    name: CI / Gate
    needs: [inspect, foundation, go, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable verification
        run: ./scripts/ci.ps1 -Mode Gate
